services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      APP_JWT_SECRET: change-this-secret-key-change-this-secret-key

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
